<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>How much you love Herta</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Moderní bezpatkový font pro celý web (nadpis i tlačítko) */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #fdf2f8; /* Jemné světlé pozadí */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #333;
        }

        h1 {
            font-size: 1.8rem;
            margin: 30px 15px;
            color: #be185d;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        h2 {
            font-size: 80px;
            font-weight: 700;
            margin: 0; /* Zruší výchozí odsazení prohlížeče ze všech stran */
            line-height: 1; /* Zabrání tomu, aby samotná velikost 80px vytvářela prázdné místo navíc */
        }
        #photo-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            background-color: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
            touch-action: none; /* Zabrání scrollování a přibližování při klikání */
            cursor: pointer;
        }

        #photo {
            width: 100%;
            display: block;
            border-radius: 12px;
            pointer-events: none; /* Aby kliknutí zachytával kontejner */
        }

        .kiss {
            position: absolute;
            font-size: 45px;
            pointer-events: none; /* Aby polibky neblokovaly další klikání */
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0) rotate(var(--rot)); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(var(--rot)); }
        }

        #more-love-btn {
            margin: 40px;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-family: inherit; /* Dědí stejný bezpatkový font */
            background-color: #be185d;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(190, 24, 93, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #more-love-btn:active {
            transform: scale(0.95);
            background-color: #9d174d;
        }
    </style>
</head>
<body>

    <h1>Show herta, how much you love her</h1> <h2>💋</h2>

    <div id="photo-container">
        <!-- Zde se načte první fotka -->
        <img id="photo" src="1.JPG" alt="Kamarádka">
    </div>

    <button id="more-love-btn">More love</button>

    <script>
        // --- ZDE UPRAV ODKAZY NA FOTKY NA FTP ---
        // Nahraď testovací odkazy za cesty k tvým fotkám (např. "fotky/1.jpg")
        const photos = [
            "1.JPG",
            "2.JPG",
            "3.JPG",
            "4.JPG",
            "5.JPG",
            "6.JPG"
        ];
        
        let currentPhotoIndex = 0;
        const container = document.getElementById('photo-container');
        const photoEl = document.getElementById('photo');
        const btn = document.getElementById('more-love-btn');

        // Funkce pro přidání polibku
        function addKiss(e) {
            e.preventDefault(); // Důležité pro mobily (zabrání posunu obrazovky)

            // Získání správných souřadnic (pro dotyk i myš)
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            // Výpočet pozice přesně v rámci fotky
            const rect = container.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            // Vytvoření HTML elementu pro polibek
            const kiss = document.createElement('div');
            kiss.classList.add('kiss');
            kiss.innerText = '💋';
            
            // Nastavení umístění (souřadnice X a Y)
            kiss.style.left = `${x}px`;
            kiss.style.top = `${y}px`;

            // Náhodné otočení od 0 do 360 stupňů
            const randomRotation = Math.floor(Math.random() * 360);
            kiss.style.setProperty('--rot', `${randomRotation}deg`);

            // Vložení polibku do kontejneru k fotce
            container.appendChild(kiss);
        }

        // Funkce pro načtení další fotky
        function nextPhoto() {
            // Smazání všech stávajících polibků
            const kisses = container.querySelectorAll('.kiss');
            kisses.forEach(k => k.remove());

            // Posun na další fotku (pokud jsme na konci, vrátí se na začátek)
            currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
            photoEl.src = photos[currentPhotoIndex];
        }

        // Přiřazení akcí (kliknutí / dotyk)
        container.addEventListener('pointerdown', addKiss);
        btn.addEventListener('click', nextPhoto);

    </script>
</body>
</html>
